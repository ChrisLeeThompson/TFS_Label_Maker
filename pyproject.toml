[project]
name = "TFS Label Maker"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.1",
    "tifffile>=2024.1.30",
    "Pillow>=10.0",
    "numpy>=1.24",
    # Optional, Windows-only: "Send to active PPT". Guarded import.
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.pyside6-project]
files = [
    "qml_resources/Components/BatchNavRow.qml",
    "qml_resources/Components/Card.qml",
    "qml_resources/Components/ColorPicker.qml",
    "qml_resources/Components/CustomSpinBox.qml",
    "qml_resources/Components/DropZone.qml",
    "qml_resources/Components/LabelPreview.qml",
    "qml_resources/Components/MetadataTree.qml",
    "qml_resources/Components/OutputPanel.qml",
    "qml_resources/Components/SettingsPanel.qml",
    "qml_resources/Components/StatusBar.qml",
    "qml_resources/Components/ToolTippedLabel.qml",
    "qml_resources/Components/qmldir",
    "qml_resources/Config/AppConfig.qml",
    "qml_resources/Config/Strings.qml",
    "qml_resources/Config/qmldir",
    "qml_resources/Effects/ColorOverlayEffect.qml",
    "qml_resources/Effects/color_overlay_effect.frag.qsb",
    "qml_resources/Effects/color_overlay_effect.vert.qsb",
    "qml_resources/Effects/qmldir",
    "qml_resources/assets/catbug_color_2.png",
